<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>100 Doors — For My Princess</title>

<style>
*{box-sizing:border-box}

html,body{
margin:0;
width:100%;
min-height:100%;
background:#050504;
color:#eee5d8;
font-family:Georgia,"Times New Roman",serif;
}

body{overflow-x:hidden}

/* INTRO */

#intro{
position:fixed;
inset:0;
z-index:100;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
background:
radial-gradient(circle at 50% 45%,#30251c 0%,#110e0b 40%,#030303 80%);
transition:opacity 1.2s ease;
}

.intro-content{
animation:introIn 2s ease;
}

@keyframes introIn{
from{opacity:0;transform:translateY(20px)}
to{opacity:1;transform:translateY(0)}
}

.intro-content h1{
font-size:clamp(55px,10vw,125px);
font-weight:normal;
letter-spacing:14px;
margin:0 0 22px;
}

.intro-content p{
font-size:18px;
color:#b9aea1;
margin:8px;
}

.enter{
margin-top:38px;
padding:15px 45px;
border:1px solid #806c56;
background:transparent;
color:#e9ddcf;
font-family:Georgia,serif;
font-size:16px;
letter-spacing:2px;
cursor:pointer;
transition:.4s;
}

.enter:hover{
background:#e9ddcf;
color:#100e0c;
}

/* HALLWAY */

#hallway{
display:none;
min-height:100vh;
background:
linear-gradient(to bottom,rgba(0,0,0,.2),rgba(0,0,0,.55)),
radial-gradient(ellipse at 50% 15%,#382b20 0%,#17110d 38%,#060606 80%);
padding-bottom:100px;
}

.header{
position:sticky;
top:0;
z-index:5;
padding:25px;
text-align:center;
background:linear-gradient(#090806,transparent);
}

.header h2{
font-weight:normal;
font-size:34px;
letter-spacing:3px;
margin:0 0 8px;
}

#progress{
font-size:14px;
color:#a99c8d;
}

/* HALLWAY FLOOR */

.hall{
position:relative;
max-width:1250px;
margin:auto;
padding:50px 5vw 100px;
}

.floor{
position:absolute;
left:0;
right:0;
bottom:0;
height:50%;
background:
linear-gradient(90deg,transparent,#211812 50%,transparent),
repeating-linear-gradient(
90deg,
rgba(255,255,255,.025) 0px,
rgba(255,255,255,.025) 2px,
transparent 2px,
transparent 110px
);
pointer-events:none;
opacity:.7;
}

/* DOORS */

.doors{
position:relative;
z-index:1;
display:grid;
grid-template-columns:repeat(5,1fr);
gap:42px 25px;
perspective:1000px;
}

.door-wrap{
perspective:900px;
}

.door{
height:270px;
position:relative;
cursor:pointer;
background:
linear-gradient(
90deg,
#16100c 0%,
#302116 20%,
#493322 50%,
#2a1d14 80%,
#120d09 100%
);
border:2px solid #5f4934;
box-shadow:
0 25px 35px rgba(0,0,0,.8),
inset 0 0 35px rgba(0,0,0,.5);
transition:
transform .5s ease,
filter .5s ease,
box-shadow .5s ease;
transform-style:preserve-3d;
}

.door:hover{
transform:translateY(-10px) rotateY(-2deg);
filter:brightness(1.15);
box-shadow:
0 35px 55px rgba(0,0,0,.9),
0 0 30px rgba(193,158,109,.1);
}

.door::before{
content:"";
position:absolute;
inset:13px;
border:1px solid #765d45;
}

.door::after{
content:"";
position:absolute;
left:50%;
top:0;
bottom:0;
width:1px;
background:rgba(0,0,0,.35);
}

.door-number{
position:absolute;
top:28px;
left:50%;
transform:translateX(-50%);
font-size:24px;
color:#d5c0a6;
z-index:2;
}

.handle{
position:absolute;
right:24px;
top:50%;
width:11px;
height:11px;
border-radius:50%;
background:#c5a66b;
box-shadow:0 0 12px rgba(197,166,107,.25);
z-index:2;
}

.door.opened{
filter:brightness(.55);
}

.door.special{
border-color:#a98758;
box-shadow:
0 0 30px rgba(190,150,90,.12),
0 25px 40px rgba(0,0,0,.85);
}

.door.special .door-number{
color:#f0d29b;
}

/* MODAL */

#modal{
display:none;
position:fixed;
inset:0;
z-index:200;
align-items:center;
justify-content:center;
padding:25px;
background:rgba(0,0,0,.92);
backdrop-filter:blur(6px);
}

.message{
width:min(700px,100%);
padding:60px 50px;
text-align:center;
background:
radial-gradient(circle at top,#30251c,#100d0a 70%);
border:1px solid #705840;
box-shadow:0 40px 120px #000;
animation:messageIn .5s ease;
}

@keyframes messageIn{
from{opacity:0;transform:scale(.92) translateY(20px)}
to{opacity:1;transform:scale(1) translateY(0)}
}

.message h3{
font-size:36px;
font-weight:normal;
color:#e4cfb5;
margin:0 0 25px;
}

.message p{
font-size:19px;
line-height:1.9;
color:#c9beb1;
margin:0;
}

.close{
margin-top:30px;
padding:12px 30px;
border:1px solid #725d47;
background:transparent;
color:#ddd0c1;
font-family:Georgia,serif;
cursor:pointer;
}

.close:hover{
background:#ddd0c1;
color:#111;
}

/* MOBILE */

@media(max-width:950px){
.doors{
grid-template-columns:repeat(3,1fr);
}
}

@media(max-width:650px){
.doors{
grid-template-columns:repeat(2,1fr);
gap:18px;
}

.door{
height:220px;
}

.message{
padding:45px 25px;
}

.message h3{
font-size:29px;
}
}
</style>
</head>

<body>

<!-- INTRO -->

<section id="intro">

<div class="intro-content">

<h1>100 DOORS</h1>

<p>There are 100 little things I want you to know.</p>
<p>Only one rule: open them.</p>

<button class="enter" onclick="enterHallway()">ENTER</button>

</div>

</section>


<!-- HALLWAY -->

<section id="hallway">

<div class="header">

<h2>For My Princess</h2>

<div id="progress">0 / 100 opened</div>

</div>


<div class="hall">

<div class="doors" id="doors"></div>

<div class="floor"></div>

</div>

</section>


<!-- MESSAGE -->

<div id="modal">

<div class="message">

<h3 id="messageTitle"></h3>

<p id="messageText"></p>

<button class="close" onclick="closeDoor()">Close Door</button>

</div>

</div>


<script>

const messages={

1:{
title:"The First Door",
text:"You opened the first door. I guess you're curious enough to see what I made for you."
},

2:{
title:"A Little Secret",
text:"Sometimes I randomly smile because something reminds me of you."
},

3:{
title:"One Thing I Love",
text:"I love the little things you do that you probably don't even realize I notice."
},

4:{
title:"You're Annoying",
text:"Unfortunately, you're also one of my favorite people. So I suppose I'll allow it."
},

5:{
title:"Your Smile",
text:"There are a million beautiful things in the world, but your smile still manages to distract me."
},

6:{
title:"A Tiny Confession",
text:"Sometimes I reread our conversations simply because I miss you."
},

7:{
title:"The Way You Say My Name",
text:"There's something about hearing you say my name that makes it feel different."
},

8:{
title:"You",
text:"Out of all the people I could have met, somehow I got you. And I'm really glad I did."
},

9:{
title:"If You Ever Forget",
text:"If you ever forget how loved you are, come back and open this door again."
},

10:{
title:"Ten Down",
text:"Only ten doors. You have ninety more little pieces of my heart to discover."
},

29:{
title:"September 29",
text:"Some numbers are just numbers. And then there is this one. 29 September. Happy Birthday, my love."
},

99:{
title:"Almost There",
text:"You really opened ninety-nine doors for me? There's only one left."
},

100:{
title:"The Last Door",
text:"If I had to live this life again, knowing everything I know now, I would still want to find you. Happy Birthday, my love."
}

};

let openedDoors=new Set();


function enterHallway(){

const intro=document.getElementById("intro");

intro.style.opacity="0";

setTimeout(()=>{

intro.style.display="none";

document.getElementById("hallway").style.display="block";

window.scrollTo(0,0);

},1200);

}


function createDoors(){

const container=document.getElementById("doors");

for(let i=1;i<=100;i++){

const wrap=document.createElement("div");

wrap.className="door-wrap";

const door=document.createElement("div");

door.className="door";

if(i===29||i===100){

door.classList.add("special");

}

door.innerHTML=`

<div class="door-number">${i}</div>

<div class="handle"></div>

`;

door.addEventListener("click",()=>openDoor(i,door));

wrap.appendChild(door);

container.appendChild(wrap);

}

}


function openDoor(number,door){

if(!openedDoors.has(number)){

openedDoors.add(number);

door.classList.add("opened");

document.getElementById("progress").textContent=
openedDoors.size+" / 100 opened";

}

const data=messages[number]||{

title:"A Little Something",
text:"This door is waiting for something sweet from me to you."

};

document.getElementById("messageTitle").textContent=data.title;

document.getElementById("messageText").textContent=data.text;

document.getElementById("modal").style.display="flex";

}


function closeDoor(){

document.getElementById("modal").style.display="none";

}


createDoors();

</script>

</body>
</html>
