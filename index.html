<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>100 Doors — For My Princess</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background: #090806;
    color: #eee7dc;
    font-family: Georgia, "Times New Roman", serif;
    min-height: 100vh;
    overflow-x: hidden;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background:
        radial-gradient(circle at 50% 30%, rgba(120, 88, 45, 0.12), transparent 45%),
        linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px);
    background-size: auto, 100% 4px;
    z-index: 0;
}

button {
    font-family: inherit;
}

/* INTRO */
/* CINEMATIC INTRO */

#intro {
    position: fixed;
    inset: 0;
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    overflow: hidden;

    background:
        radial-gradient(
            circle at 50% 45%,
            rgba(91, 62, 35, 0.28) 0%,
            rgba(25, 18, 12, 0.7) 35%,
            #050403 75%
        );

    transition:
        opacity 1.2s ease,
        visibility 1.2s ease;
}

#intro::before {
    content: "";
    position: absolute;
    inset: 0;

    background:
        radial-gradient(
            ellipse at center,
            transparent 20%,
            rgba(0,0,0,0.75) 100%
        );

    pointer-events: none;
}

#intro.hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
}

.intro-content {
    position: relative;
    z-index: 2;
    width: 90%;
    max-width: 800px;

    animation: introAppear 2s ease forwards;
}

.intro-small {
    font-family: Georgia, serif;
    font-size: 12px;
    letter-spacing: 7px;
    color: #b8a58d;
    margin-bottom: 24px;

    animation: fadeUp 1.5s ease forwards;
}

.intro-line {
    width: 70px;
    height: 1px;
    background: #806b50;
    margin: 0 auto 35px;

    animation: lineGrow 1.5s ease forwards;
}

.intro-title {
    margin: 0;

    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(70px, 15vw, 150px);
    font-weight: normal;
    line-height: 0.78;
    letter-spacing: 12px;

    color: #eee5d7;

    text-shadow:
        0 5px 30px rgba(0,0,0,0.9),
        0 0 60px rgba(160,120,70,0.08);
}

.intro-title span {
    font-size: 0.72em;
    letter-spacing: 18px;
    margin-left: 18px;
}

.intro-subtitle {
    margin-top: 45px;

    font-family: Georgia, "Times New Roman", serif;
    font-size: 17px;
    line-height: 1.8;

    color: #bcae9d;
    font-style: italic;

    animation: fadeUp 2s ease 0.4s both;
}

.enter-btn {
    margin-top: 42px;

    padding: 15px 42px;

    border: 1px solid #806b50;
    background: rgba(0,0,0,0.15);

    color: #eee5d7;

    font-family: Georgia, serif;
    font-size: 12px;
    letter-spacing: 5px;

    cursor: pointer;

    transition:
        background 0.4s ease,
        color 0.4s ease,
        transform 0.4s ease,
        box-shadow 0.4s ease;

    animation: fadeUp 2s ease 0.8s both;
}

.enter-btn:hover {
    background: #eee5d7;
    color: #100c08;

    transform: translateY(-3px);

    box-shadow:
        0 10px 35px rgba(0,0,0,0.5);
}


/* INTRO ANIMATIONS */

@keyframes introAppear {
    from {
        opacity: 0;
        transform: scale(0.97);
    }

    to {
        opacity: 1;
        transform: scale(1);
    }
}

@keyframes fadeUp {
    from {
        opacity: 0;
        transform: translateY(15px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes lineGrow {
    from {
        width: 0;
        opacity: 0;
    }

    to {
        width: 70px;
        opacity: 1;
    }
}


/* MAIN */

#hallway {
    min-height: 100vh;
    padding: 70px 25px;
    position: relative;
    z-index: 1;
}

.header {
    text-align: center;
    margin-bottom: 55px;
}

.header-small {
    font-size: 11px;
    letter-spacing: 5px;
    color: #907e68;
    margin-bottom: 15px;
}

.header-title {
    font-size: clamp(35px, 7vw, 70px);
    font-weight: normal;
    letter-spacing: 4px;
}

.header-subtitle {
    margin-top: 15px;
    color: #958777;
    font-size: 15px;
}

.progress {
    margin-top: 25px;
    font-size: 12px;
    letter-spacing: 3px;
    color: #a9967d;
}

/* DOORS */

.hall {
    max-width: 1250px;
    margin: auto;
    padding: 35px;
    background:
        linear-gradient(90deg, rgba(0,0,0,0.25), transparent 10%, transparent 90%, rgba(0,0,0,0.25)),
        #15100c;
    border-left: 1px solid #2b2118;
    border-right: 1px solid #2b2118;
    box-shadow:
        inset 0 0 80px rgba(0,0,0,0.7),
        0 20px 70px rgba(0,0,0,0.5);
}

.floor {
    height: 18px;
    margin: 30px -35px -35px;
    background: linear-gradient(#3b2c1f, #120e0a);
    border-top: 1px solid #4b3928;
}

.doors {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 35px 25px;
}

.door-wrap {
    perspective: 700px;
}

.door {
    height: 250px;
    position: relative;
    cursor: pointer;
    background:
        linear-gradient(90deg, rgba(255,255,255,0.025), transparent 25%, rgba(0,0,0,0.3)),
        linear-gradient(#38291d, #1d140e);
    border: 5px solid #4b3928;
    box-shadow:
        inset 0 0 0 3px #17100b,
        inset 0 0 35px rgba(0,0,0,0.7),
        0 15px 25px rgba(0,0,0,0.45);
    transition: transform 0.35s ease, filter 0.35s ease;
}

.door:hover {
    transform: translateY(-7px) rotateY(-3deg);
    filter: brightness(1.15);
}

.door.opened {
    border-color: #75624a;
}

.door-number {
    position: absolute;
    top: 18px;
    left: 20px;
    font-size: 13px;
    letter-spacing: 3px;
    color: #aa967b;
}

.handle {
    position: absolute;
    right: 22px;
    top: 52%;
    width: 13px;
    height: 13px;
    border-radius: 50%;
    background: #9c845f;
    box-shadow: 0 0 8px rgba(200,170,110,0.25);
}

.door-label {
    position: absolute;
    bottom: 24px;
    left: 20px;
    right: 20px;
    font-size: 14px;
    color: #d3c5b4;
}

.opened-mark {
    position: absolute;
    right: 20px;
    top: 18px;
    font-size: 12px;
    color: #b99e76;
}

/* MODAL */

#modal {
    position: fixed;
    inset: 0;
    z-index: 200;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 25px;
    background: rgba(0,0,0,0.82);
    backdrop-filter: blur(7px);
}

#modal.show {
    display: flex;
}

.modal-box {
    width: min(850px, 100%);
    max-height: 90vh;
    overflow-y: auto;
    padding: 45px;
    background:
        radial-gradient(circle at top, #302217, #130e09 65%);
    border: 1px solid #5a4732;
    box-shadow: 0 30px 100px rgba(0,0,0,0.8);
    text-align: center;
    position: relative;
}

.modal-door {
    font-size: 11px;
    letter-spacing: 5px;
    color: #9b856c;
}

.modal-title {
    margin-top: 15px;
    font-size: clamp(30px, 6vw, 55px);
    font-weight: normal;
}

.message {
    margin: 25px auto;
    max-width: 680px;
    color: #c9bcae;
    font-size: 17px;
    line-height: 1.9;
    white-space: pre-line;
}

/* MEDIA */

.media-container {
    margin: 30px auto;
    max-width: 720px;
}

.media-container img,
.media-container video {
    width: 100%;
    max-height: 500px;
    object-fit: contain;
    border: 1px solid #4c3a28;
    box-shadow: 0 15px 40px rgba(0,0,0,0.5);
}

.audio-player {
    width: 100%;
    margin-top: 15px;
}

.media-label {
    font-size: 11px;
    letter-spacing: 3px;
    color: #927d65;
    margin-bottom: 12px;
}

.close-btn {
    margin-top: 20px;
    padding: 12px 28px;
    background: transparent;
    border: 1px solid #66533c;
    color: #d9ccbb;
    cursor: pointer;
    letter-spacing: 2px;
}

.close-btn:hover {
    background: #d9ccbb;
    color: #110d09;
}

/* RESPONSIVE */

@media (max-width: 1000px) {
    .doors {
        grid-template-columns: repeat(3, 1fr);
    }
}

@media (max-width: 650px) {
    #hallway {
        padding: 45px 12px;
    }

    .hall {
        padding: 20px;
    }

    .doors {
        grid-template-columns: repeat(2, 1fr);
        gap: 20px 15px;
    }

    .door {
        height: 210px;
    }

    .floor {
        margin-left: -20px;
        margin-right: -20px;
        margin-bottom: -20px;
    }

    .modal-box {
        padding: 30px 20px;
    }
}
</style>
</head>

<body>

<!-- INTRO -->

<section id="intro">
    <div class="intro-content">
        <div class="eyebrow">A LITTLE WORLD I MADE FOR YOU</div>

        <h1 class="intro-title">100 DOORS</h1>

        <p class="intro-subtitle">
            There are 100 little things I want you to know.<br>
            Only one rule: open them.
        </p>

        <button class="enter-btn" onclick="enterHallway()">
            ENTER
        </button>
    </div>
</section>


<!-- HALLWAY -->

<main id="hallway">

    <header class="header">
        <div class="header-small">WELCOME HOME</div>

        <h2 class="header-title">For My Princess</h2>

        <p class="header-subtitle">
            Every door has something waiting for you.
        </p>

        <div class="progress" id="progress">
            0 / 100 opened
        </div>
    </header>

    <section class="hall">
        <div class="doors" id="doors"></div>
        <div class="floor"></div>
    </section>

</main>


<!-- MODAL -->

<div id="modal">

    <div class="modal-box">

        <div class="modal-door" id="modalDoor">
            DOOR 01
        </div>

        <h2 class="modal-title" id="modalTitle">
            A Little Something
        </h2>

        <div class="message" id="modalMessage"></div>

        <div class="media-container" id="mediaContainer"></div>

        <button class="close-btn" onclick="closeDoor()">
            BACK TO THE HALLWAY
        </button>

    </div>

</div>


<script>

/*
====================================================
DOOR CONTENT
====================================================

type can be:

"text"
"image"
"video"
"audio"

Later we can also combine multiple types
inside one door.
*/

const doors = {

    1: {
        type: "text",
        title: "The First Door",
        message: "If you opened this one first, I already know you are curious."
    },

    2: {
        type: "text",
        title: "Something I Love",
        message: "I love the way you can make an ordinary conversation feel like something I want to remember."
    },

    3: {
        type: "text",
        title: "Your Smile",
        message: "Your smile has no business affecting my entire mood like that."
    },

    4: {
        type: "text",
        title: "A Tiny Secret",
        message: "Sometimes I look at our old conversations and smile like an idiot."
    },

    5: {
        type: "text",
        title: "For You",
        message: "You are one of the very few people I want beside me when life gets difficult."
    },

    6: {
        type: "text",
        title: "A Memory",
        message: "Some memories are loud. Others are tiny moments that somehow stay forever."
    },

    7: {
        type: "audio",
        title: "Listen To Me",
        message: "I wanted you to hear this one instead of reading it.",
        src: "YOUR-AUDIO-FILE-HERE.mp3"
    },

    8: {
        type: "text",
        title: "Another Little Thing",
        message: "You became part of my future without me even noticing when it happened."
    },

    9: {
        type: "image",
        title: "A Memory Of Us",
        message: "Some pictures deserve their own little door.",
        src: "YOUR-IMAGE-HERE.jpg"
    },

    10: {
        type: "video",
        title: "Watch This",
        message: "This one is for you.",
        src: "YOUR-VIDEO-HERE.mp4"
    },

    29: {
        type: "text",
        title: "Happy Birthday, My Love",
        message: "Today is yours. But somehow I still feel lucky that I get to exist in the same story as you."
    },

    99: {
        type: "text",
        title: "Almost There",
        message: "You made it this far. One more door after this."
    },

    100: {
        type: "text",
        title: "The Last Door",
        message: "If you reached this door, then you opened every little piece of this world I made for you.\n\nAnd if I could put one thing behind this door, it would simply be this:\n\nI choose you.\n\nNot just for today. Not just for a birthday. For the life I hope we get to build together."
    }

};


/*
====================================================
STATE
====================================================
*/

const openedDoors = new Set();


/*
====================================================
ENTER
====================================================
*/

function enterHallway() {

    document.getElementById("intro").classList.add("hidden");

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


/*
====================================================
CREATE 100 DOORS
====================================================
*/

function createDoors() {

    const container = document.getElementById("doors");

    container.innerHTML = "";

    for (let i = 1; i <= 100; i++) {

        const data = doors[i] || {
            type: "text",
            title: "A Little Something",
            message: "This door is waiting for something sweet from me to you."
        };

        const wrap = document.createElement("div");
        wrap.className = "door-wrap";

        const door = document.createElement("div");
        door.className = "door";
        door.id = "door-" + i;

        door.onclick = function() {
            openDoor(i);
        };

        const number = document.createElement("div");
        number.className = "door-number";
        number.textContent =
            "DOOR " + String(i).padStart(2, "0");

        const handle = document.createElement("div");
        handle.className = "handle";

        const label = document.createElement("div");
        label.className = "door-label";
        label.textContent = data.title;

        door.appendChild(number);
        door.appendChild(handle);
        door.appendChild(label);

        wrap.appendChild(door);

        container.appendChild(wrap);
    }

}


/*
====================================================
OPEN DOOR
====================================================
*/

function openDoor(number) {

    const data = doors[number] || {
        type: "text",
        title: "A Little Something",
        message: "This door is waiting for something sweet from me to you."
    };

    openedDoors.add(number);

    const doorElement = document.getElementById("door-" + number);

    if (doorElement) {
        doorElement.classList.add("opened");
    }

    document.getElementById("modalDoor").textContent =
        "DOOR " + String(number).padStart(2, "0");

    document.getElementById("modalTitle").textContent =
        data.title;

    document.getElementById("modalMessage").textContent =
        data.message || "";

    const media = document.getElementById("mediaContainer");

    media.innerHTML = "";

    /*
    -------------------------
    IMAGE
    -------------------------
    */

    if (data.type === "image" && data.src) {

        media.innerHTML = `
            <div class="media-label">A MEMORY</div>
            <img src="${data.src}" alt="A memory">
        `;

    }


    /*
    -------------------------
    VIDEO
    -------------------------
    */

    if (data.type === "video" && data.src) {

        media.innerHTML = `
            <div class="media-label">A LITTLE VIDEO FOR YOU</div>
            <video controls playsinline>
                <source src="${data.src}">
                Your browser does not support video.
            </video>
        `;

    }


    /*
    -------------------------
    AUDIO
    -------------------------
    */

    if (data.type === "audio" && data.src) {

        media.innerHTML = `
            <div class="media-label">A VOICE NOTE FROM ME</div>
            <audio class="audio-player" controls>
                <source src="${data.src}">
                Your browser does not support audio.
            </audio>
        `;

    }


    document.getElementById("modal").classList.add("show");

    updateProgress();

}


/*
====================================================
CLOSE DOOR
====================================================
*/

function closeDoor() {

    const media = document.getElementById("mediaContainer");

    media.innerHTML = "";

    document.getElementById("modal").classList.remove("show");

}


/*
====================================================
PROGRESS
====================================================
*/

function updateProgress() {

    document.getElementById("progress").textContent =
        openedDoors.size + " / 100 opened";

}


/*
====================================================
START
====================================================
*/

createDoors();

</script>

</body>
</html>
