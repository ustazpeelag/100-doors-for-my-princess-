<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>100 Doors — For My Princess</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html {
    scroll-behavior: smooth;
}

body {
    background: #090806;
    color: #eee7dc;
    font-family: Georgia, "Times New Roman", serif;
    min-height: 100vh;
    overflow-x: hidden;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;

    background:
        radial-gradient(
            circle at 50% 30%,
            rgba(120, 88, 45, 0.12),
            transparent 45%
        ),
        linear-gradient(
            rgba(255,255,255,0.015) 1px,
            transparent 1px
        );

    background-size: auto, 100% 4px;
    z-index: 9999;
}

button {
    font-family: inherit;
}


/* =====================================================
   INTRO
===================================================== */

#intro {
    position: fixed;
    inset: 0;
    z-index: 1000;

    display: flex;
    align-items: center;
    justify-content: center;

    text-align: center;
    overflow: hidden;

    background:
        radial-gradient(
            circle at 50% 45%,
            rgba(91, 62, 35, 0.28),
            rgba(25, 18, 12, 0.72) 38%,
            #050403 78%
        );

    transition:
        opacity 1.2s ease,
        visibility 1.2s ease;
}

#intro::before {
    content: "";
    position: absolute;
    inset: 0;

    background:
        radial-gradient(
            ellipse at center,
            transparent 18%,
            rgba(0,0,0,0.8) 100%
        );

    pointer-events: none;
}

#intro.hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
}

.intro-content {
    position: relative;
    z-index: 2;

    width: 90%;
    max-width: 800px;

    animation: introAppear 1.8s ease forwards;
}

.intro-small {
    font-size: 12px;
    letter-spacing: 7px;
    color: #b8a58d;
    margin-bottom: 24px;
}

.intro-line {
    width: 70px;
    height: 1px;
    background: #806b50;
    margin: 0 auto 35px;
}

.intro-title {
    margin: 0;

    font-size: clamp(70px, 15vw, 150px);
    font-weight: normal;

    line-height: 0.8;
    letter-spacing: 12px;

    color: #eee5d7;

    text-shadow:
        0 5px 30px rgba(0,0,0,0.9),
        0 0 60px rgba(160,120,70,0.08);
}

.intro-title span {
    font-size: 0.72em;
    letter-spacing: 18px;
    margin-left: 18px;
}

.intro-subtitle {
    margin-top: 45px;

    font-size: 17px;
    line-height: 1.8;

    color: #bcae9d;
    font-style: italic;
}

.enter-btn {
    margin-top: 42px;

    padding: 15px 42px;

    border: 1px solid #806b50;
    background: rgba(0,0,0,0.2);

    color: #eee5d7;

    font-size: 12px;
    letter-spacing: 5px;

    cursor: pointer;

    transition:
        background 0.4s ease,
        color 0.4s ease,
        transform 0.4s ease,
        box-shadow 0.4s ease;
}

.enter-btn:hover {
    background: #eee5d7;
    color: #100c08;

    transform: translateY(-3px);

    box-shadow:
        0 10px 35px rgba(0,0,0,0.6);
}

@keyframes introAppear {
    from {
        opacity: 0;
        transform: scale(0.97);
    }

    to {
        opacity: 1;
        transform: scale(1);
    }
}


/* =====================================================
   MAIN
===================================================== */

#hallway {
    min-height: 100vh;

    padding:
        70px 25px
        100px;

    position: relative;
    z-index: 1;
}


/* =====================================================
   HEADER
===================================================== */

.header {
    text-align: center;
    margin-bottom: 55px;
}

.header-small {
    font-size: 11px;
    letter-spacing: 5px;

    color: #907e68;

    margin-bottom: 15px;
}

.header-title {
    font-size:
        clamp(35px, 7vw, 70px);

    font-weight: normal;

    letter-spacing: 4px;
}

.header-subtitle {
    margin-top: 15px;

    color: #958777;

    font-size: 15px;
}

.progress {
    margin-top: 25px;

    font-size: 12px;

    letter-spacing: 3px;

    color: #a9967d;
}


/* =====================================================
   HALLWAY
===================================================== */

.hall {
    position: relative;

    max-width: 1250px;

    margin: auto;

    padding: 55px 50px 80px;

    min-height: 900px;

    overflow: hidden;

    background:
        linear-gradient(
            90deg,
            rgba(0,0,0,0.55),
            transparent 12%,
            transparent 88%,
            rgba(0,0,0,0.55)
        ),
        linear-gradient(
            180deg,
            #0b0806,
            #1a110b 25%,
            #17100b 75%,
            #0b0806
        );

    border-left: 2px solid #302216;
    border-right: 2px solid #302216;

    box-shadow:
        inset 0 0 100px rgba(0,0,0,0.8),
        0 25px 80px rgba(0,0,0,0.65);
}

.hall::before {
    content: "";

    position: absolute;

    top: 0;
    left: 0;
    right: 0;

    height: 55px;

    background:
        linear-gradient(
            180deg,
            #080604,
            #20150d
        );

    border-bottom: 2px solid #39291b;

    box-shadow:
        0 10px 25px rgba(0,0,0,0.5);

    pointer-events: none;
}

.hall::after {
    content: "";

    position: absolute;

    width: 80%;
    height: 70%;

    top: 15%;
    left: 10%;

    background:
        radial-gradient(
            ellipse,
            rgba(130,90,45,0.08),
            transparent 70%
        );

    pointer-events: none;
}


/* =====================================================
   DOORS
===================================================== */

.doors {
    position: relative;
    z-index: 5;

    display: grid;

    grid-template-columns:
        repeat(4, minmax(150px, 1fr));

    gap: 45px 30px;

    max-width: 1100px;

    margin: 35px auto 0;

    padding: 20px;
}

.door-wrap {
    perspective: 900px;
}

.door {
    position: relative;

    height: 280px;

    background:

        repeating-linear-gradient(
            90deg,
            rgba(255,255,255,0.015) 0px,
            rgba(255,255,255,0.015) 2px,
            transparent 2px,
            transparent 13px
        ),

        linear-gradient(
            90deg,
            #0b0704,
            #28180e 12%,
            #190f09 50%,
            #28180e 88%,
            #0b0704
        );

    border:
        2px solid #4b3524;

    border-radius: 3px;

    box-shadow:
        inset 0 0 0 6px rgba(0,0,0,0.35),
        inset 0 0 35px rgba(0,0,0,0.75),
        0 18px 35px rgba(0,0,0,0.7);

    cursor: pointer;

    display: flex;
    align-items: center;
    justify-content: center;

    transition:
        transform 0.4s ease,
        box-shadow 0.4s ease,
        border-color 0.4s ease,
        filter 0.4s ease;
}

.door::before {
    content: "";

    position: absolute;

    inset: 14px;

    border:
        1px solid rgba(150,115,75,0.38);

    box-shadow:
        inset 0 0 20px rgba(0,0,0,0.55);

    pointer-events: none;
}

.door::after {
    content: "";

    position: absolute;

    left: 27px;
    right: 27px;

    top: 55px;

    height: 82px;

    border:
        1px solid rgba(140,110,75,0.25);

    box-shadow:
        inset 0 0 18px rgba(0,0,0,0.45);

    pointer-events: none;
}

.door:hover {
    transform:
        translateY(-7px)
        rotateY(-3deg);

    border-color: #806b50;

    filter: brightness(1.12);

    box-shadow:
        inset 0 0 0 6px rgba(0,0,0,0.25),
        inset 0 0 35px rgba(0,0,0,0.5),
        0 25px 50px rgba(0,0,0,0.8),
        0 0 25px rgba(120,88,45,0.12);
}

.door.opened {
    border-color: #75624a;

    box-shadow:
        inset 0 0 45px rgba(0,0,0,0.85),
        0 15px 30px rgba(0,0,0,0.6);
}


/* =====================================================
   CINEMATIC DOOR OPENING
===================================================== */

.door.cinematic-open {
    animation:
        cinematicDoorOpen
        0.65s
        cubic-bezier(.22,.61,.36,1)
        forwards;
}

@keyframes cinematicDoorOpen {

    0% {
        transform:
            scale(1)
            rotateY(0deg);
        filter:
            brightness(1);
    }

    45% {
        transform:
            scale(1.08)
            rotateY(-7deg);
        filter:
            brightness(1.35);
    }

    100% {
        transform:
            scale(1.18)
            rotateY(-12deg);
        filter:
            brightness(1.7);
        opacity: 0.15;
    }
}


/* =====================================================
   CINEMATIC TRANSITION
===================================================== */

#doorTransition {
    position: fixed;

    inset: 0;

    z-index: 1900;

    display: flex;

    align-items: center;
    justify-content: center;

    pointer-events: none;

    opacity: 0;
    visibility: hidden;

    background:
        radial-gradient(
            circle at center,
            rgba(91,62,35,0.35),
            rgba(0,0,0,0.96) 70%
        );

    transition:
        opacity 0.35s ease,
        visibility 0.35s ease;
}

#doorTransition.show {
    opacity: 1;
    visibility: visible;
}

.transition-door {
    width: 260px;
    height: 420px;

    background:
        repeating-linear-gradient(
            90deg,
            rgba(255,255,255,0.02) 0px,
            rgba(255,255,255,0.02) 3px,
            transparent 3px,
            transparent 18px
        ),
        linear-gradient(
            90deg,
            #080503,
            #321d10 15%,
            #1b1009 50%,
            #321d10 85%,
            #080503
        );

    border: 3px solid #60452d;

    box-shadow:
        inset 0 0 0 10px rgba(0,0,0,0.4),
        inset 0 0 70px rgba(0,0,0,0.8),
        0 0 100px rgba(0,0,0,0.9);

    transform:
        perspective(1000px)
        scale(0.25)
        rotateY(0deg);

    opacity: 0;

    transition:
        transform 0.7s cubic-bezier(.16,1,.3,1),
        opacity 0.7s ease;
}

#doorTransition.show .transition-door {
    transform:
        perspective(1000px)
        scale(1.5)
        rotateY(-18deg);

    opacity: 1;
}

.transition-door::before {
    content: "";

    position: absolute;

    inset: 20px;

    border: 1px solid rgba(170,130,85,0.35);

    box-shadow:
        inset 0 0 35px rgba(0,0,0,0.7);
}

.transition-door::after {
    content: "";

    position: absolute;

    width: 14px;
    height: 14px;

    border-radius: 50%;

    right: 25px;
    top: 50%;

    background: #b09468;

    box-shadow:
        0 0 15px rgba(210,175,110,0.5);
}


/* =====================================================
   DOOR TEXT
===================================================== */

.door-number {
    position: absolute;

    top: 18px;
    left: 20px;

    font-size: 13px;

    letter-spacing: 3px;

    color: #aa967b;

    z-index: 5;
}

.handle {
    position: absolute;

    right: 22px;
    top: 52%;

    width: 13px;
    height: 13px;

    border-radius: 50%;

    background: #9c845f;

    box-shadow:
        0 0 8px rgba(200,170,110,0.25);

    z-index: 5;
}

.door-label {
    position: absolute;

    bottom: 24px;

    left: 20px;
    right: 20px;

    font-size: 14px;

    color: #d3c5b4;

    z-index: 5;
}


/* =====================================================
   FLOOR
===================================================== */

.floor {
    position: absolute;

    left: 0;
    right: 0;
    bottom: 0;

    height: 70px;

    background:
        linear-gradient(
            180deg,
            #3a2a1d,
            #17100b 45%,
            #080605
        );

    border-top:
        2px solid #4b3826;

    box-shadow:
        inset 0 15px 25px rgba(0,0,0,0.5);

    z-index: 2;
}


/* =====================================================
   MODAL
===================================================== */

#modal {
    position: fixed;

    inset: 0;

    z-index: 2000;

    display: none;

    align-items: center;
    justify-content: center;

    padding: 25px;

    background:
        rgba(0,0,0,0.84);

    backdrop-filter:
        blur(7px);
}

#modal.show {
    display: flex;
}

.modal-box {
    width:
        min(850px, 100%);

    max-height:
        90vh;

    overflow-y:
        auto;

    padding:
        45px;

    background:
        radial-gradient(
            circle at top,
            #302217,
            #130e09 65%
        );

    border:
        1px solid #5a4732;

    box-shadow:
        0 30px 100px rgba(0,0,0,0.8);

    text-align:
        center;

    position:
        relative;

    opacity: 0;
    transform: scale(0.92) translateY(20px);
}

#modal.show .modal-box {
    animation:
        modalReveal
        0.55s
        cubic-bezier(.16,1,.3,1)
        0.15s
        forwards;
}

@keyframes modalReveal {

    from {
        opacity: 0;
        transform:
            scale(0.92)
            translateY(20px);
    }

    to {
        opacity: 1;
        transform:
            scale(1)
            translateY(0);
    }
}

.modal-door {
    font-size: 11px;

    letter-spacing: 5px;

    color: #9b856c;
}

.modal-title {
    margin-top: 15px;

    font-size:
        clamp(30px, 6vw, 55px);

    font-weight:
        normal;
}

.message {
    margin:
        25px auto;

    max-width:
        680px;

    color:
        #c9bcae;

    font-size:
        17px;

    line-height:
        1.9;

    white-space:
        pre-line;
}

.media-container {
    margin:
        30px auto;

    max-width:
        720px;
}

.media-container img,
.media-container video {
    width:
        100%;

    max-height:
        500px;

    object-fit:
        contain;

    border:
        1px solid #4c3a28;

    box-shadow:
        0 15px 40px rgba(0,0,0,0.5);
}

.audio-player {
    width:
        100%;

    margin-top:
        15px;
}

.media-label {
    font-size:
        11px;

    letter-spacing:
        3px;

    color:
        #927d65;

    margin-bottom:
        12px;
}

.close-btn {
    margin-top:
        20px;

    padding:
        12px 28px;

    background:
        transparent;

    border:
        1px solid #66533c;

    color:
        #d9ccbb;

    cursor:
        pointer;

    letter-spacing:
        2px;
}

.close-btn:hover {
    background:
        #d9ccbb;

    color:
        #110d09;
}


/* =====================================================
   RESPONSIVE
===================================================== */

@media (max-width: 1000px) {

    .doors {
        grid-template-columns:
            repeat(3, 1fr);
    }

}

@media (max-width: 650px) {

    #hallway {
        padding:
            45px 12px
            80px;
    }

    .hall {
        padding:
            45px 15px
            70px;
    }

    .doors {
        grid-template-columns:
            repeat(2, 1fr);

        gap:
            20px 15px;

        padding:
            10px;
    }

    .door {
        height:
            210px;
    }

    .door-label {
        left:
            10px;

        right:
            10px;

        bottom:
            18px;

        font-size:
            12px;
    }

    .door-number {
        left:
            12px;

        top:
            14px;

        font-size:
            11px;
    }

    .handle {
        right:
            15px;
    }

    .modal-box {
        padding:
            30px 20px;
    }

    .transition-door {
        width: 180px;
        height: 300px;
    }

}

@media (max-width: 430px) {

    .intro-small {
        font-size:
            9px;

        letter-spacing:
            5px;
    }

    .intro-title {
        font-size:
            60px;

        letter-spacing:
            7px;
    }

    .intro-title span {
        letter-spacing:
            10px;

        margin-left:
            8px;
    }

    .intro-subtitle {
        font-size:
            14px;
    }

    .door {
        height:
            190px;
    }

}

</style>
</head>

<body>


<section id="intro">

    <div class="intro-content">

        <div class="intro-small">
            FOR MY PRINCESS
        </div>

        <div class="intro-line"></div>

        <h1 class="intro-title">
            100<br>
            <span>DOORS</span>
        </h1>

        <p class="intro-subtitle">
            A hundred little pieces of my heart,<br>
            waiting for you.
        </p>

        <button
            class="enter-btn"
            onclick="enterHallway()"
        >
            ENTER
        </button>

    </div>

</section>


<main id="hallway">

    <header class="header">

        <div class="header-small">
            WELCOME HOME
        </div>

        <h2 class="header-title">
            For My Princess
        </h2>

        <p class="header-subtitle">
            Every door has something waiting for you.
        </p>

        <div
            class="progress"
            id="progress"
        >
            0 / 100 opened
        </div>

    </header>


    <section class="hall">

        <div
            class="doors"
            id="doors"
        ></div>

        <div class="floor"></div>

    </section>

</main>


<!-- CINEMATIC TRANSITION -->

<div id="doorTransition">

    <div class="transition-door"></div>

</div>


<div id="modal">

    <div class="modal-box">

        <div
            class="modal-door"
            id="modalDoor"
        >
            DOOR 01
        </div>

        <h2
            class="modal-title"
            id="modalTitle"
        >
            A Little Something
        </h2>

        <div
            class="message"
            id="modalMessage"
        ></div>

        <div
            class="media-container"
            id="mediaContainer"
        ></div>

        <button
            class="close-btn"
            onclick="closeDoor()"
        >
            BACK TO THE HALLWAY
        </button>

    </div>

</div>

    6: {

12: {

    message: `I swear, I don't think I've ever been called "dickhead" this many times by one person.

const openedDoors = new Set();

let openingDoor = false;


/* =====================================================
   ENTER HALLWAY
===================================================== */

function enterHallway() {

    const intro =
        document.getElementById("intro");

    intro.classList.add("hidden");

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


/* =====================================================
   CREATE 100 DOORS
===================================================== */

function createDoors() {

    const container =
        document.getElementById("doors");

    container.innerHTML = "";

    for (
        let i = 1;
        i <= 100;
        i++
    ) {

        const data =
            doors[i] || {

                type: "text",

                title:
                    "A Little Something",

                message:
                    "This door is waiting for something sweet from me to you."

            };


        const wrap =
            document.createElement("div");

        wrap.className =
            "door-wrap";


        const door =
            document.createElement("div");

        door.className =
            "door";

        door.id =
            "door-" + i;


        door.onclick =
            function() {

                openDoor(i);

            };


        const number =
            document.createElement("div");

        number.className =
            "door-number";

        number.textContent =
            "DOOR " +
            String(i).padStart(2, "0");


        const handle =
            document.createElement("div");

        handle.className =
            "handle";


        const label =
            document.createElement("div");

        label.className =
            "door-label";

        label.textContent =
            data.title;


        door.appendChild(number);

        door.appendChild(handle);

        door.appendChild(label);

        wrap.appendChild(door);

        container.appendChild(wrap);

    }

}


/* =====================================================
   OPEN DOOR
===================================================== */

function openDoor(number) {

    if (openingDoor) {
        return;
    }

    const data =
        doors[number] || {

            type: "text",

            title:
                "A Little Something",

            message:
                "This door is waiting for something sweet from me to you."

        };


    const doorElement =
        document.getElementById(
            "door-" + number
        );

    const transition =
        document.getElementById(
            "doorTransition"
        );


    openingDoor = true;

    openedDoors.add(number);


    /*
       STEP 1
       Animate the actual door.
    */

    if (doorElement) {

        doorElement.classList.add(
            "cinematic-open"
        );

    }


    /*
       STEP 2
       Bring in the giant cinematic door.
    */

    setTimeout(function() {

        transition.classList.add("show");

    }, 120);


    /*
       STEP 3
       Prepare the content while
       the transition is happening.
    */

    document.getElementById(
        "modalDoor"
    ).textContent =
        "DOOR " +
        String(number).padStart(2, "0");


    document.getElementById(
        "modalTitle"
    ).textContent =
        data.title;


    document.getElementById(
        "modalMessage"
    ).textContent =
        data.message || "";


    const media =
        document.getElementById(
            "mediaContainer"
        );


    media.innerHTML = "";


    if (
        data.type === "image" &&
        data.src
    ) {

        media.innerHTML = `
            <div class="media-label">
                A MEMORY
            </div>

            <img
                src="${data.src}"
                alt="A memory"
            >
        `;

    }


    if (
        data.type === "video" &&
        data.src
    ) {

        media.innerHTML = `
            <div class="media-label">
                A LITTLE VIDEO FOR YOU
            </div>

            <video
                controls
                playsinline
            >

                <source src="${data.src}">

                Your browser does not support video.

            </video>
        `;

    }


    if (
        data.type === "audio" &&
        data.src
    ) {

        media.innerHTML = `
            <div class="media-label">
                A VOICE NOTE FROM ME
            </div>

            <audio
                class="audio-player"
                controls
            >

                <source src="${data.src}">

                Your browser does not support audio.

            </audio>
        `;

    }


    /*
       STEP 4
       Reveal the actual content.
    */

    setTimeout(function() {

        document
            .getElementById("modal")
            .classList
            .add("show");


        updateProgress();

    }, 650);


    /*
       STEP 5
       Finish the transition.
    */

    setTimeout(function() {

        transition.classList.remove("show");

        openingDoor = false;

    }, 1000);

}


/* =====================================================
   CLOSE DOOR
===================================================== */

function closeDoor() {

    const media =
        document.getElementById(
            "mediaContainer"
        );

    media.innerHTML = "";


    document
        .getElementById("modal")
        .classList
        .remove("show");


    const transition =
        document.getElementById(
            "doorTransition"
        );

    transition.classList.remove("show");


    document
        .querySelectorAll(".cinematic-open")
        .forEach(function(door) {

            door.classList.remove(
                "cinematic-open"
            );

        });


    openingDoor = false;

}


/* =====================================================
   PROGRESS
===================================================== */

function updateProgress() {

    document.getElementById(
        "progress"
    ).textContent =
        openedDoors.size +
        " / 100 opened";

}


/* =====================================================
   ESCAPE KEY
===================================================== */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Escape"
        ) {

            closeDoor();

        }

    }
);


/* =====================================================
   START
===================================================== */

createDoors();

</script>
