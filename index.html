<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html {
    scroll-behavior: smooth;
}

body {
    min-height: 100vh;
    overflow-x: hidden;

    background:
        radial-gradient(
            circle at top,
            #241914 0%,
            #0d0a08 48%,
            #050403 100%
        );

    color: #f3e8d8;

    font-family:
        Georgia,
        "Times New Roman",
        serif;
}

/* =========================
   INTRO
========================= */

#intro {
    position: fixed;
    inset: 0;

    z-index: 1000;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 30px;

    text-align: center;

    background:
        radial-gradient(
            circle,
            #211712 0%,
            #080605 70%
        );

    transition:
        opacity 1s ease,
        visibility 1s ease;
}

#intro.hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
}

.intro-content {
    width: 100%;
    max-width: 650px;
}

.intro-small {
    margin-bottom: 25px;

    color: #b9a28c;

    font-size: 13px;
    letter-spacing: 5px;
    text-transform: uppercase;
}

.intro-title {
    margin-bottom: 20px;

    font-size: clamp(45px, 10vw, 90px);
    font-weight: normal;
    letter-spacing: 3px;
}

.intro-subtitle {
    margin-bottom: 40px;

    color: #c7b5a3;

    font-size: 18px;
    line-height: 1.8;
}

.enter-button {
    padding: 15px 32px;

    border: 1px solid #9d8268;

    background: transparent;

    color: #f3e8d8;

    font-family: inherit;
    font-size: 15px;
    letter-spacing: 3px;
    text-transform: uppercase;

    cursor: pointer;

    transition:
        background .3s ease,
        color .3s ease,
        transform .3s ease;
}

.enter-button:hover {
    background: #f3e8d8;
    color: #120d09;
    transform: translateY(-2px);
}

/* =========================
   HALLWAY
========================= */

#hallway {
    min-height: 100vh;

    padding:
        35px 20px 80px;
}

.header {
    width: min(1200px, 100%);

    margin:
        0 auto 45px;

    text-align: center;
}

.header-title {
    margin-bottom: 10px;

    font-size:
        clamp(30px, 6vw, 55px);

    font-weight: normal;
    letter-spacing: 2px;
}

.header-subtitle {
    color: #a99582;

    font-size: 15px;
    letter-spacing: 1px;
}

.progress {
    margin-top: 18px;

    color: #8f7c6a;

    font-size: 13px;
    letter-spacing: 2px;
}

/* =========================
   DOORS
========================= */

#doors {
    width: min(1200px, 100%);

    margin: 0 auto;

    display: grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(155px, 1fr)
        );

    gap: 22px;
}

.door-wrap {
    perspective: 900px;
}

.door {
    position: relative;

    height: 220px;

    display: flex;
    align-items: center;
    justify-content: center;

    background:
        linear-gradient(
            145deg,
            #3b271c,
            #1d120d 55%,
            #0e0907
        );

    border: 1px solid #614836;

    box-shadow:
        inset 0 0 0 7px rgba(0,0,0,.15),
        inset 0 0 30px rgba(0,0,0,.5),
        0 15px 30px rgba(0,0,0,.35);

    cursor: pointer;

    transition:
        transform .35s ease,
        border-color .35s ease,
        box-shadow .35s ease;
}

.door::before {
    content: "";

    position: absolute;

    inset: 12px;

    border: 1px solid
        rgba(188,155,122,.25);

    pointer-events: none;
}

.door:hover {
    transform: translateY(-6px);

    border-color: #a7896b;

    box-shadow:
        inset 0 0 30px rgba(0,0,0,.55),
        0 20px 40px rgba(0,0,0,.55);
}

.door-number {
    position: absolute;

    top: 20px;

    color: #a99078;

    font-size: 11px;
    letter-spacing: 3px;
}

.door-label {
    max-width: 125px;

    color: #eadcca;

    font-size: 18px;
    line-height: 1.35;

    text-align: center;
}

.handle {
    position: absolute;

    top: 50%;
    right: 22px;

    width: 9px;
    height: 9px;

    border-radius: 50%;

    background: #b29370;

    box-shadow:
        0 0 8px
        rgba(178,147,112,.3);
}

.cinematic-open {
    transform:
        perspective(900px)
        rotateY(-12deg)
        scale(.98);
}

/* =========================
   TRANSITION
========================= */

#doorTransition {
    position: fixed;
    inset: 0;

    z-index: 900;

    background: #000;

    opacity: 0;

    pointer-events: none;

    transition:
        opacity .45s ease;
}

#doorTransition.show {
    opacity: 1;
}

/* =========================
   MODAL
========================= */

#modal {
    position: fixed;
    inset: 0;

    z-index: 950;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 25px;

    background:
        rgba(0,0,0,.78);

    opacity: 0;
    visibility: hidden;

    transition:
        opacity .4s ease,
        visibility .4s ease;
}

#modal.show {
    opacity: 1;
    visibility: visible;
}

.modal-box {
    position: relative;

    width: min(720px, 100%);
    max-height: 90vh;

    overflow-y: auto;

    padding:
        35px 30px 30px;

    background:
        linear-gradient(
            145deg,
            #211611,
            #100b08
        );

    border: 1px solid #5c4535;

    box-shadow:
        0 30px 80px
        rgba(0,0,0,.7);
}

.modal-door {
    margin-bottom: 12px;

    color: #8f7864;

    font-size: 11px;
    letter-spacing: 4px;
}

.modal-title {
    margin-bottom: 25px;

    font-size:
        clamp(27px, 6vw, 42px);

    font-weight: normal;
}

.modal-message {
    color: #d8c8b8;

    font-size: 17px;
    line-height: 1.9;

    white-space: pre-line;
}

.close-button {
    position: absolute;

    top: 15px;
    right: 17px;

    width: 42px;
    height: 42px;

    border: 1px solid #5d4737;

    background: transparent;

    color: #d7c5b3;

    font-size: 20px;

    cursor: pointer;
}

.close-button:hover {
    background: #2b1d15;
}

/* =========================
   MEDIA
========================= */

#mediaContainer {
    margin-top: 28px;
}

#mediaContainer img,
#mediaContainer video {
    display: block;

    width: 100%;
    max-height: 65vh;

    object-fit: contain;

    border: 1px solid #49372b;
}

.audio-player {
    width: 100%;
}

.media-label {
    margin-bottom: 10px;

    color: #927a65;

    font-size: 10px;
    letter-spacing: 3px;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

    #hallway {
        padding:
            25px 14px 60px;
    }

    #doors {
        grid-template-columns:
            repeat(2, minmax(0, 1fr));

        gap: 13px;
    }

    .door {
        height: 190px;
    }

    .door-label {
        max-width: 110px;
        font-size: 15px;
    }

    .modal-box {
        padding:
            30px 20px 25px;
    }

    .modal-message {
        font-size: 16px;
        line-height: 1.8;
    }

}

</style>
</head>

const enterButton = document.getElementById("enterButton");
const intro = document.getElementById("intro");
const hallway = document.getElementById("hallway");
const doorsContainer = document.getElementById("doors");

const modal = document.getElementById("modal");
const closeButton = document.getElementById("closeButton");
const modalDoor = document.getElementById("modalDoor");
const modalTitle = document.getElementById("modalTitle");
const modalMessage = document.getElementById("modalMessage");
const mediaContainer = document.getElementById("mediaContainer");

const progressText = document.getElementById("progress");

let openedDoors = new Set();

function enterHallway() {
    intro.classList.add("hidden");
    hallway.classList.remove("hidden");

    createDoors();
    updateProgress();
}

function createDoors() {
    doorsContainer.innerHTML = "";

    for (let number = 1; number <= 100; number++) {
        const doorData = doors[number];

        if (!doorData) continue;

        const door = document.createElement("button");

        door.type = "button";
        door.className = "door";

        if (openedDoors.has(number)) {
            door.classList.add("opened");
        }

        door.innerHTML = `
            <span class="door-number">${number}</span>
            <span class="door-label">${doorData.title}</span>
        `;

        door.addEventListener("click", function () {
            openDoor(number);
        });

        doorsContainer.appendChild(door);
    }
}

function openDoor(number) {
    const doorData = doors[number];

    if (!doorData) return;

    openedDoors.add(number);

    modalDoor.textContent = `DOOR ${number}`;
    modalTitle.textContent = doorData.title;

    modalMessage.textContent = doorData.message;

    mediaContainer.innerHTML = "";

    if (doorData.type === "image" && doorData.src) {
        const image = document.createElement("img");

        image.src = doorData.src;
        image.alt = doorData.title;

        mediaContainer.appendChild(image);
    }

    if (doorData.type === "video" && doorData.src) {
        const video = document.createElement("video");

        video.src = doorData.src;
        video.controls = true;
        video.playsInline = true;

        mediaContainer.appendChild(video);
    }

    if (doorData.type === "audio" && doorData.src) {
        const audio = document.createElement("audio");

        audio.src = doorData.src;
        audio.controls = true;

        mediaContainer.appendChild(audio);
    }

    modal.classList.remove("hidden");

    createDoors();
    updateProgress();
}

function closeDoor() {
    modal.classList.add("hidden");

    mediaContainer.innerHTML = "";
}

function updateProgress() {
    const count = openedDoors.size;

    if (progressText) {
        progressText.textContent = `${count} / 100 doors opened`;
    }
}

enterButton.addEventListener("click", enterHallway);

closeButton.addEventListener("click", closeDoor);

modal.addEventListener("click", function (event) {
    if (event.target === modal) {
        closeDoor();
    }
});

document.addEventListener("keydown", function (event) {
    if (event.key === "Escape") {
        closeDoor();
    }
});

createDoors();
updateProgress();
</script>
