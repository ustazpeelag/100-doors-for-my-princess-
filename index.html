<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>100 Doors — For My Princess</title>

<style>

/* =====================================================
   RESET
===================================================== */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html {
    scroll-behavior: smooth;
}

body {
    background: #070605;
    color: #eee7dc;
    font-family: Georgia, "Times New Roman", serif;
    min-height: 100vh;
    overflow-x: hidden;
}

/* Cinematic grain */

body::before {
    content: "";
    position: fixed;
    inset: 0;

    pointer-events: none;

    background:
        radial-gradient(
            circle at 50% 30%,
            rgba(130, 91, 47, 0.12),
            transparent 45%
        ),
        linear-gradient(
            rgba(255,255,255,0.018) 1px,
            transparent 1px
        );

    background-size:
        auto,
        100% 4px;

    z-index: 9999;
}

button {
    font-family: inherit;
}


/* =====================================================
   INTRO
===================================================== */

#intro {
    position: fixed;
    inset: 0;

    z-index: 1000;

    display: flex;
    align-items: center;
    justify-content: center;

    text-align: center;

    overflow: hidden;

    background:
        radial-gradient(
            circle at 50% 45%,
            rgba(91, 62, 35, 0.3),
            rgba(25, 18, 12, 0.75) 38%,
            #050403 78%
        );

    transition:
        opacity 1.3s ease,
        visibility 1.3s ease;
}

#intro::before {
    content: "";

    position: absolute;
    inset: 0;

    background:
        radial-gradient(
            ellipse at center,
            transparent 15%,
            rgba(0,0,0,0.85) 100%
        );

    pointer-events: none;
}

#intro::after {
    content: "";

    position: absolute;

    width: 500px;
    height: 500px;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    background:
        radial-gradient(
            circle,
            rgba(150,105,55,0.08),
            transparent 70%
        );

    filter: blur(20px);

    animation: candleGlow 5s ease-in-out infinite alternate;
}

#intro.hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
}

.intro-content {
    position: relative;
    z-index: 2;

    width: 90%;
    max-width: 800px;

    animation: introAppear 2s ease forwards;
}

.intro-small {
    font-size: 12px;
    letter-spacing: 7px;

    color: #b8a58d;

    margin-bottom: 25px;
}

.intro-line {
    width: 70px;
    height: 1px;

    background: #806b50;

    margin: 0 auto 35px;
}

.intro-title {
    margin: 0;

    font-size: clamp(70px, 15vw, 150px);

    font-weight: normal;

    line-height: 0.8;

    letter-spacing: 12px;

    color: #eee5d7;

    text-shadow:
        0 5px 30px rgba(0,0,0,0.9),
        0 0 70px rgba(160,120,70,0.08);
}

.intro-title span {
    font-size: 0.72em;
    letter-spacing: 18px;
    margin-left: 18px;
}

.intro-subtitle {
    margin-top: 45px;

    font-size: 17px;

    line-height: 1.9;

    color: #bcae9d;

    font-style: italic;
}

.enter-btn {
    margin-top: 42px;

    padding: 15px 42px;

    border: 1px solid #806b50;

    background: rgba(0,0,0,0.2);

    color: #eee5d7;

    font-size: 12px;

    letter-spacing: 5px;

    cursor: pointer;

    transition:
        background 0.4s ease,
        color 0.4s ease,
        transform 0.4s ease,
        box-shadow 0.4s ease;
}

.enter-btn:hover {
    background: #eee5d7;

    color: #100c08;

    transform: translateY(-3px);

    box-shadow:
        0 10px 35px rgba(0,0,0,0.6);
}

@keyframes introAppear {

    from {
        opacity: 0;
        transform: scale(0.96);
    }

    to {
        opacity: 1;
        transform: scale(1);
    }

}

@keyframes candleGlow {

    from {
        opacity: 0.5;
        transform: translate(-50%, -50%) scale(0.9);
    }

    to {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.1);
    }

}


/* =====================================================
   MAIN
===================================================== */

#hallway {

    min-height: 100vh;

    padding:
        75px 25px
        100px;

    position: relative;

    z-index: 1;

    background:
        radial-gradient(
            ellipse at center top,
            rgba(72,48,29,0.16),
            transparent 55%
        );
}


/* =====================================================
   HEADER
===================================================== */

.header {

    text-align: center;

    margin-bottom: 60px;
}

.header-small {

    font-size: 11px;

    letter-spacing: 6px;

    color: #907e68;

    margin-bottom: 17px;
}

.header-title {

    font-size:
        clamp(38px, 7vw, 72px);

    font-weight: normal;

    letter-spacing: 4px;

    color: #eee5d7;
}

.header-subtitle {

    margin-top: 18px;

    color: #958777;

    font-size: 15px;
}

.progress {

    margin-top: 25px;

    font-size: 12px;

    letter-spacing: 3px;

    color: #a9967d;
}


/* =====================================================
   MANSION HALL
===================================================== */

.hall {

    position: relative;

    max-width: 1300px;

    margin: auto;

    padding:
        70px 65px
        55px;

    min-height: 900px;

    overflow: hidden;

    background:

        /* ceiling darkness */

        linear-gradient(
            180deg,
            #0a0806 0%,
            transparent 15%
        ),

        /* wall */

        linear-gradient(
            90deg,
            #100c09,
            #21160e 12%,
            #17100b 50%,
            #21160e 88%,
            #100c09
        );

    border-left: 2px solid #2e2116;
    border-right: 2px solid #2e2116;

    box-shadow:

        inset 0 0 100px rgba(0,0,0,0.85),

        inset 0 100px 100px rgba(0,0,0,0.5),

        0 30px 100px rgba(0,0,0,0.7);
}


/* ceiling beams */

.hall::before {

    content: "";

    position: absolute;

    top: 0;
    left: 0;
    right: 0;

    height: 55px;

    background:

        repeating-linear-gradient(
            90deg,
            #0c0907 0px,
            #0c0907 80px,
            #24190f 82px,
            #24190f 95px
        );

    border-bottom: 2px solid #332419;

    opacity: 0.8;

    pointer-events: none;
}


/* distant hallway glow */

.hall::after {

    content: "";

    position: absolute;

    top: 50%;

    left: 50%;

    width: 70%;

    height: 70%;

    transform:
        translate(-50%, -50%);

    background:
        radial-gradient(
            ellipse,
            rgba(112,78,42,0.08),
            transparent 70%
        );

    pointer-events: none;
}


/* =====================================================
   FLOOR
===================================================== */

.floor {

    position: absolute;

    left: 0;
    right: 0;
    bottom: 0;

    height: 85px;

    background:

        linear-gradient(
            180deg,
            #302116 0%,
            #17100b 35%,
            #080605 100%
        );

    border-top:
        2px solid #4a3625;

    box-shadow:
        inset 0 20px 30px rgba(0,0,0,0.5);

    z-index: 1;
}

.floor::before {

    content: "";

    position: absolute;

    top: 25px;
    left: 0;
    right: 0;

    height: 1px;

    background: #60472e;

    opacity: 0.4;
}


/* =====================================================
   WALL LIGHTS
===================================================== */

.wall-light {

    position: absolute;

    width: 8px;
    height: 8px;

    border-radius: 50%;

    background: #b8915d;

    box-shadow:
        0 0 8px #b8915d,
        0 0 30px rgba(185,145,93,0.45),
        0 0 70px rgba(185,145,93,0.18);

    z-index: 3;
}

.light-left {
    left: 25px;
    top: 28%;
}

.light-right {
    right: 25px;
    top: 28%;
}


/* =====================================================
   DOOR GRID
===================================================== */

.doors {

    position: relative;

    z-index: 5;

    display: grid;

    grid-template-columns:
        repeat(4, minmax(150px, 1fr));

    gap:
        60px 38px;

    max-width: 1120px;

    margin: auto;
}


/* =====================================================
   DOOR WRAPPER
===================================================== */

.door-wrap {

    position: relative;

    perspective: 1000px;
}


/* =====================================================
   DOOR
===================================================== */

.door {

    position: relative;

    height: 310px;

    overflow: hidden;

    display: flex;

    align-items: center;

    justify-content: center;

    cursor: pointer;

    background:

        /* wood grain */

        repeating-linear-gradient(
            90deg,
            rgba(255,255,255,0.015) 0px,
            rgba(255,255,255,0.015) 2px,
            transparent 2px,
            transparent 12px
        ),

        linear-gradient(
            90deg,
            #0b0705,
            #28180e 10%,
            #1b1009 50%,
            #28180e 90%,
            #0b0705
        );

    border:
        3px solid #4b3523;

    box-shadow:

        inset 0 0 0 7px rgba(0,0,0,0.4),

        inset 0 0 35px rgba(0,0,0,0.8),

        0 20px 40px rgba(0,0,0,0.7);

    transition:
        transform 0.45s ease,
        box-shadow 0.45s ease,
        border-color 0.45s ease;
}


/* outer frame */

.door::before {

    content: "";

    position: absolute;

    inset: 16px;

    border:
        1px solid rgba(160,125,82,0.4);

    box-shadow:

        inset 0 0 25px rgba(0,0,0,0.7);

    pointer-events: none;
}


/* upper wooden panel */

.door::after {

    content: "";

    position: absolute;

    left: 28px;
    right: 28px;

    top: 58px;

    height: 90px;

    border:
        1px solid rgba(140,105,65,0.25);

    box-shadow:
        inset 0 0 25px rgba(0,0,0,0.4);

    pointer-events: none;
}


/* hover */

.door:hover {

    transform:
        translateY(-8px)
        rotateY(-3deg);

    border-color: #876d4d;

    box-shadow:

        inset 0 0 0 7px rgba(0,0,0,0.25),

        inset 0 0 35px rgba(0,0,0,0.55),

        0 30px 55px rgba(0,0,0,0.85),

        0 0 30px rgba(140,105,65,0.12);
}


/* opened */

.door.opened {

    border-color: #806849;

    background:

        linear-gradient(
            90deg,
            #090604,
            #160e09,
            #090604
        );

    box-shadow:

        inset 0 0 50px rgba(0,0,0,0.9),

        0 15px 30px rgba(0,0,0,0.6);
}


/* =====================================================
   DOOR NUMBER
===================================================== */

.door-number {

    position: absolute;

    top: 25px;
    left: 0;
    right: 0;

    text-align: center;

    font-size: 13px;

    letter-spacing: 4px;

    color: #b29a7b;

    z-index: 10;
}


/* =====================================================
   HANDLE
===================================================== */

.handle {

    position: absolute;

    right: 24px;

    top: 53%;

    width: 12px;
    height: 12px;

    border-radius: 50%;

    background: #a98a5f;

    box-shadow:
        0 0 7px rgba(200,170,110,0.45);

    z-index: 10;
}


/* =====================================================
   DOOR LABEL
===================================================== */

.door-label {

    position: absolute;

    left: 20px;
    right: 20px;

    bottom: 28px;

    text-align: center;

    font-size: 14px;

    line-height: 1.4;

    color: #d3c5b4;

    z-index: 10;
}


/* =====================================================
   OPENED MARK
===================================================== */

.opened-mark {

    position: absolute;

    right: 18px;

    top: 20px;

    font-size: 11px;

    color: #c0a477;

    z-index: 10;
}


/* =====================================================
   MODAL
===================================================== */

#modal {

    position: fixed;

    inset: 0;

    z-index: 2000;

    display: none;

    align-items: center;

    justify-content: center;

    padding: 25px;

    background:
        rgba(0,0,0,0.88);

    backdrop-filter:
        blur(9px);
}

#modal.show {

    display: flex;
}

.modal-box {

    width:
        min(850px, 100%);

    max-height:
        90vh;

    overflow-y:
        auto;

    padding:
        45px;

    position:
        relative;

    text-align:
        center;

    background:

        radial-gradient(
            circle at top,
            #302217,
            #130e09 65%
        );

    border:
        1px solid #5a4732;

    box-shadow:
        0 30px 100px rgba(0,0,0,0.9);
}

.modal-door {

    font-size: 11px;

    letter-spacing: 5px;

    color: #9b856c;
}

.modal-title {

    margin-top: 15px;

    font-size:
        clamp(30px, 6vw, 55px);

    font-weight:
        normal;

    color:
        #eee5d7;
}

.message {

    margin:
        25px auto;

    max-width:
        680px;

    color:
        #c9bcae;

    font-size:
        17px;

    line-height:
        1.9;

    white-space:
        pre-line;
}


/* =====================================================
   MEDIA
===================================================== */

.media-container {

    margin:
        30px auto;

    max-width:
        720px;
}

.media-container img,
.media-container video {

    width:
        100%;

    max-height:
        500px;

    object-fit:
        contain;

    border:
        1px solid #4c3a28;

    box-shadow:
        0 15px 40px rgba(0,0,0,0.5);
}

.audio-player {

    width:
        100%;

    margin-top:
        15px;
}

.media-label {

    font-size:
        11px;

    letter-spacing:
        3px;

    color:
        #927d65;

    margin-bottom:
        12px;
}


/* =====================================================
   CLOSE BUTTON
===================================================== */

.close-btn {

    margin-top:
        20px;

    padding:
        12px 28px;

    background:
        transparent;

    border:
        1px solid #66533c;

    color:
        #d9ccbb;

    cursor:
        pointer;

    letter-spacing:
        2px;

    transition:
        0.3s ease;
}

.close-btn:hover {

    background:
        #d9ccbb;

    color:
        #110d09;
}


/* =====================================================
   RESPONSIVE
===================================================== */

@media (max-width: 1000px) {

    .hall {

        padding:
            65px 40px
            50px;
    }

    .doors {

        grid-template-columns:
            repeat(3, 1fr);

        gap:
            45px 25px;
    }

    .door {

        height:
            285px;
    }
}


@media (max-width: 700px) {

    #hallway {

        padding:
            50px 12px
            80px;
    }

    .header {

        margin-bottom:
            40px;
    }

    .hall {

        padding:
            55px 18px
            45px;

        min-height:
            800px;
    }

    .doors {

        grid-template-columns:
            repeat(2, 1fr);

        gap:
            28px 15px;
    }

    .door {

        height:
            220px;
    }

    .door-number {

        top:
            19px;

        font-size:
            11px;

        letter-spacing:
            3px;
    }

    .door-label {

        bottom:
            20px;

        font-size:
            12px;
    }

    .handle {

        right:
            15px;
    }

    .modal-box {

        padding:
            30px 20px;
    }
}


@media (max-width: 480px) {

    .intro-small {

        font-size:
            9px;

        letter-spacing:
            5px;
    }

    .intro-title {

        font-size:
            65px;

        letter-spacing:
            7px;
    }

    .intro-title span {

        letter-spacing:
            9px;

        margin-left:
            9px;
    }

    .intro-subtitle {

        font-size:
            15px;
    }

    .enter-btn {

        padding:
            14px 32px;
    }

    .hall {

        padding:
            50px 12px
            40px;
    }

    .door {

        height:
            195px;
    }

    .door::before {

        inset:
            10px;
    }

    .door::after {

        left:
            20px;

        right:
            20px;

        top:
            45px;

        height:
            65px;
    }

    .door-label {

        left:
            10px;

        right:
            10px;

        bottom:
            16px;

        font-size:
            11px;
    }

}


/* =====================================================
   END CSS
===================================================== */

</style>
</head>


<body>

     INTRO
===================================================== -->

        <div class="intro-small">
            FOR MY PRINCESS
        </div>

        <div class="intro-line"></div>

        <div

        ></div>

        <button
            class="close-btn"
            onclick="closeDoor()"
        >
            BACK TO THE HALLWAY
        </button>

    </div>

</div>
