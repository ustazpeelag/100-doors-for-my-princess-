<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>100 Doors For My Princess</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    min-height: 100%;
}

body {
    background:
        radial-gradient(
            circle at center,
            rgba(80, 54, 36, 0.16),
            transparent 45%
        ),
        linear-gradient(
            135deg,
            #080605 0%,
            #100b08 45%,
            #050403 100%
        );

    color: #eee4d5;
    font-family: Georgia, "Times New Roman", serif;

    overflow-x: hidden;
}

/* =========================
   INTRO
========================= */

#intro {
    position: fixed;
    inset: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    text-align: center;

    background:
        radial-gradient(
            circle at center,
            rgba(101, 67, 42, 0.22),
            transparent 42%
        ),
        linear-gradient(
            135deg,
            #080605,
            #120c08,
            #050403
        );

    z-index: 1000;

    transition:
        opacity 1.4s ease,
        visibility 1.4s ease;
}

#intro.hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
}

.intro-content {
    width: min(90%, 650px);
    padding: 30px;
}

.intro-small {
    color: #a99883;
    font-size: 12px;
    letter-spacing: 5px;
    text-transform: uppercase;
    margin-bottom: 22px;
}

.intro-title {
    font-size: clamp(42px, 9vw, 82px);
    font-weight: normal;
    letter-spacing: 3px;
    line-height: 1.05;

    text-shadow:
        0 0 30px rgba(255, 220, 170, 0.08);
}

.intro-subtitle {
    margin-top: 22px;

    color: #9e9182;

    font-size: 15px;
    line-height: 1.8;
}

#enterButton {
    margin-top: 42px;

    padding: 15px 34px;

    background: transparent;
    color: #e9dccb;

    border: 1px solid rgba(214, 184, 145, 0.45);

    font-family: inherit;
    font-size: 13px;
    letter-spacing: 3px;
    text-transform: uppercase;

    cursor: pointer;

    transition:
        background 0.4s ease,
        border-color 0.4s ease,
        transform 0.4s ease;
}

#enterButton:hover {
    background: rgba(188, 148, 105, 0.12);
    border-color: rgba(214, 184, 145, 0.8);
    transform: translateY(-2px);
}

/* =========================
   HALLWAY
========================= */

#hallway {
    min-height: 100vh;

    padding:
        50px
        clamp(18px, 5vw, 70px)
        80px;

    opacity: 1;

    animation: hallwayAppear 1.4s ease;
}

#hallway.hidden {
    display: none;
}

@keyframes hallwayAppear {
    from {
        opacity: 0;
        transform: scale(1.04);
    }

    to {
        opacity: 1;
        transform: scale(1);
    }
}

.hallway-header {
    max-width: 1000px;
    margin: 0 auto 45px;

    text-align: center;
}

.hallway-eyebrow {
    color: #887865;

    font-size: 11px;
    letter-spacing: 5px;
    text-transform: uppercase;

    margin-bottom: 13px;
}

.hallway-title {
    font-size: clamp(34px, 7vw, 64px);
    font-weight: normal;
    letter-spacing: 2px;
}

.hallway-subtitle {
    margin-top: 12px;

    color: #918475;

    font-size: 14px;
}

#progress {
    margin-top: 18px;

    color: #a99781;

    font-size: 12px;
    letter-spacing: 2px;
}

/* =========================
   DOOR GRID
========================= */

#doors {
    width: min(1100px, 100%);
    margin: 0 auto;

    display: grid;

    grid-template-columns:
        repeat(4, minmax(0, 1fr));

    gap: 20px;
}

.door {
    position: relative;

    min-height: 180px;

    padding: 25px 15px;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    color: #d9cbb9;

    background:
        linear-gradient(
            145deg,
            rgba(76, 49, 31, 0.82),
            rgba(31, 20, 13, 0.95)
        );

    border:
        1px solid
        rgba(174, 139, 101, 0.3);

    border-radius: 3px;

    font-family: Georgia, "Times New Roman", serif;

    cursor: pointer;

    overflow: hidden;

    box-shadow:
        inset 0 0 35px rgba(0, 0, 0, 0.55),
        0 15px 35px rgba(0, 0, 0, 0.3);

    transition:
        transform 0.45s ease,
        border-color 0.45s ease,
        box-shadow 0.45s ease,
        background 0.45s ease;
}

.door::before {
    content: "";

    position: absolute;

    inset: 9px;

    border:
        1px solid
        rgba(198, 164, 123, 0.12);

    pointer-events: none;
}

.door::after {
    content: "";

    position: absolute;

    width: 80px;
    height: 80px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(207, 169, 123, 0.08),
            transparent 70%
        );

    top: -30px;
    right: -25px;

    transition: transform 0.5s ease;
}

.door:hover {
    transform:
        translateY(-7px)
        scale(1.015);

    border-color:
        rgba(207, 169, 123, 0.65);

    background:
        linear-gradient(
            145deg,
            rgba(91, 59, 37, 0.9),
            rgba(37, 23, 15, 0.98)
        );

    box-shadow:
        inset 0 0 40px rgba(0, 0, 0, 0.5),
        0 20px 45px rgba(0, 0, 0, 0.5);
}

.door:hover::after {
    transform: scale(2);
}

.door-number {
    position: relative;
    z-index: 2;

    font-size: 31px;

    color: #c8ad8c;

    margin-bottom: 14px;
}

.door-label {
    position: relative;
    z-index: 2;

    max-width: 90%;

    color: #b8aa99;

    font-size: 12px;
    letter-spacing: 1.5px;

    text-align: center;
    line-height: 1.5;
}

.door.opened {
    border-color:
        rgba(177, 143, 103, 0.22);

    opacity: 0.72;
}

.door.opened .door-number {
    color: #8e7962;
}

/* =========================
   TRANSITION
========================= */

#doorTransition {
    position: fixed;
    inset: 0;

    background: #050403;

    opacity: 0;
    visibility: hidden;

    z-index: 900;

    pointer-events: none;

    transition:
        opacity 0.7s ease,
        visibility 0.7s ease;
}

#doorTransition.active {
    opacity: 1;
    visibility: visible;
}

/* =========================
   MODAL
========================= */

#modal {
    position: fixed;
    inset: 0;

    z-index: 1100;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 25px;

    background:
        rgba(3, 2, 2, 0.9);

    backdrop-filter: blur(8px);

    opacity: 1;
    visibility: visible;

    transition:
        opacity 0.45s ease,
        visibility 0.45s ease;
}

#modal.hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
}

.modal-content {
    position: relative;

    width: min(760px, 100%);
    max-height: 90vh;

    overflow-y: auto;

    padding:
        clamp(30px, 6vw, 60px)
        clamp(22px, 6vw, 65px);

    background:
        linear-gradient(
            145deg,
            #17100b,
            #0c0806
        );

    border:
        1px solid
        rgba(191, 156, 116, 0.35);

    box-shadow:
        0 30px 90px rgba(0, 0, 0, 0.75);

    animation: modalOpen 0.55s ease;
}

@keyframes modalOpen {
    from {
        opacity: 0;
        transform:
            translateY(25px)
            scale(0.96);
    }

    to {
        opacity: 1;
        transform:
            translateY(0)
            scale(1);
    }
}

#closeButton {
    position: absolute;

    top: 14px;
    right: 17px;

    width: 40px;
    height: 40px;

    border: none;
    background: transparent;

    color: #9c8b77;

    font-size: 27px;

    cursor: pointer;

    transition:
        color 0.3s ease,
        transform 0.3s ease;
}

#closeButton:hover {
    color: #e3d3c0;
    transform: rotate(90deg);
}

#modalDoor {
    color: #8e7962;

    font-size: 10px;
    letter-spacing: 4px;
    text-transform: uppercase;

    margin-bottom: 13px;
}

#modalTitle {
    color: #e8d9c7;

    font-size: clamp(28px, 5vw, 44px);

    font-weight: normal;

    line-height: 1.2;

    margin-bottom: 25px;
}

#modalMessage {
    color: #c4b6a5;

    font-size: 16px;

    line-height: 1.9;

    white-space: pre-line;
}

#mediaContainer {
    margin-top: 30px;

    display: flex;
    flex-direction: column;
    align-items: center;

    gap: 18px;
}

#mediaContainer img,
#mediaContainer video {
    display: block;

    max-width: 100%;
    max-height: 55vh;

    border:
        1px solid
        rgba(193, 158, 119, 0.3);

    box-shadow:
        0 20px 50px rgba(0, 0, 0, 0.5);
}

#mediaContainer audio {
    width: min(500px, 100%);
}

/* =========================
   MOBILE
========================= */

@media (max-width: 850px) {

    #doors {
        grid-template-columns:
            repeat(3, minmax(0, 1fr));

        gap: 14px;
    }

    .door {
        min-height: 155px;
    }
}

@media (max-width: 600px) {

    #hallway {
        padding:
            35px
            14px
            60px;
    }

    #doors {
        grid-template-columns:
            repeat(2, minmax(0, 1fr));

        gap: 12px;
    }

    .door {
        min-height: 145px;
        padding: 20px 10px;
    }

    .door-number {
        font-size: 27px;
    }

    .door-label {
        font-size: 11px;
    }

    #modal {
        padding: 12px;
    }

    .modal-content {
        max-height: 94vh;
        padding: 38px 22px;
    }

    #modalMessage {
        font-size: 15px;
        line-height: 1.8;
    }
}

@media (max-width: 360px) {

    #doors {
        gap: 9px;
    }

    .door {
        min-height: 135px;
    }

    .door-label {
        font-size: 10px;
    }
}

</style>
</head>

<body>

<section id="intro">

    const intro = document.getElementById("intro");
    const hallway = document.getElementById("hallway");
    const enterButton = document.getElementById("enterButton");

    const doorsContainer = document.getElementById("doors");
    const progress = document.getElementById("progress");

    const modal = document.getElementById("modal");
    const closeButton = document.getElementById("closeButton");

    const modalDoor = document.getElementById("modalDoor");
    const modalTitle = document.getElementById("modalTitle");
    const modalMessage = document.getElementById("modalMessage");
    const mediaContainer = document.getElementById("mediaContainer");

    const doorTransition = document.getElementById("doorTransition");

    const openedDoors = new Set();


    function enterHallway() {
        intro.classList.add("hidden");

        setTimeout(() => {
            hallway.classList.remove("hidden");
        }, 500);
    }


    function createDoors() {
        doorsContainer.innerHTML = "";

        for (let number = 1; number <= 100; number++) {

            const doorData = doors[number];

            const door = document.createElement("button");

            door.type = "button";
            door.className = "door";
            door.dataset.number = number;

            const numberElement = document.createElement("div");
            numberElement.className = "door-number";
            numberElement.textContent = number;

            const labelElement = document.createElement("div");
            labelElement.className = "door-label";

            if (doorData && doorData.title) {
                labelElement.textContent = doorData.title;
            } else {
                labelElement.textContent = "A secret waits inside";
            }

            door.appendChild(numberElement);
            door.appendChild(labelElement);

            door.addEventListener("click", () => {
                openDoor(number);
            });

            doorsContainer.appendChild(door);
        }
    }


    function openDoor(number) {

        const doorData = doors[number];

        if (!doorData) {
            return;
        }

        openedDoors.add(number);

        updateProgress();

        const doorElement =
            doorsContainer.querySelector(
                `.door[data-number="${number}"]`
            );

        if (doorElement) {
            doorElement.classList.add("opened");
        }


        modalDoor.textContent =
            "DOOR " + String(number).padStart(2, "0");

        modalTitle.textContent =
            doorData.title || "A Little Something";

        modalMessage.textContent =
            doorData.message || "";

        mediaContainer.innerHTML = "";


        if (doorData.type === "image" && doorData.src) {

            const image = document.createElement("img");

            image.src = doorData.src;
            image.alt = doorData.title || "A picture";

            image.addEventListener("error", () => {
                image.style.display = "none";

                const errorText =
                    document.createElement("div");

                errorText.textContent =
                    "The picture couldn't be loaded.";

                errorText.style.color = "#9e9182";
                errorText.style.fontSize = "14px";

                mediaContainer.appendChild(errorText);
            });

            mediaContainer.appendChild(image);
        }


        if (doorData.type === "video" && doorData.src) {

            const video = document.createElement("video");

            video.src = doorData.src;
            video.controls = true;
            video.playsInline = true;

            mediaContainer.appendChild(video);
        }


        if (doorData.type === "audio" && doorData.src) {

            const audio = document.createElement("audio");

            audio.src = doorData.src;
            audio.controls = true;

            mediaContainer.appendChild(audio);
        }


        modal.classList.remove("hidden");

        document.body.style.overflow = "hidden";
    }


    function closeDoor() {

        modal.classList.add("hidden");

        document.body.style.overflow = "";
    }


    function updateProgress() {

        const count = openedDoors.size;

        progress.textContent =
            count + " / 100 doors opened";
    }


    enterButton.addEventListener(
        "click",
        enterHallway
    );


    closeButton.addEventListener(
        "click",
        closeDoor
    );


    modal.addEventListener("click", (event) => {

        if (event.target === modal) {
            closeDoor();
        }

    });


    document.addEventListener("keydown", (event) => {

        if (event.key === "Escape") {
            closeDoor();
        }

    });


    createDoors();
    updateProgress();

</script>
